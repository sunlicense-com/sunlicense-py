[project]
name = "sunlicense"
version = "0.0.1"
description = "Official SunLicense client for Python — licence key management and validation for indie software developers."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Hapangama", email = "kasun@hapangama.com" }]
keywords = [
    "license",
    "licence",
    "licensing",
    "license-key",
    "activation",
    "drm",
    "anti-piracy",
    "sunlicense",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://sunlicense.com"
Documentation = "https://docs.sunlicense.hapangama.com"
Repository = "https://github.com/sunlicense-com/sunlicense-py"
Issues = "https://github.com/sunlicense-com/sunlicense-py/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
